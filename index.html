<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Servicios en la Nube - CTP La Suiza</title> 
    <style> 
        /* ================= VARIABLES Y RESET ================= */ 
        :root { 
            --primary: #00d2ff; 
            --secondary: #3a7bd5; 
            --dark: #070b14; 
            --dark-card: rgba(30, 41, 59, 0.65); 
            --text-light: #f8fafc; 
            --text-muted: #cbd5e1; 
            --accent-glow: rgba(0, 210, 255, 0.25); 
        } 

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; } 
         
        body {  
            background-color: var(--dark);  
            color: var(--text-light);  
            line-height: 1.6;  
            overflow-x: hidden;  
            min-height: 100vh; 
            position: relative;
        } 

        /* ================= FONDO ANIMADO ================= */ 
        #canvas-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            opacity: 0.25; 
        } 

        /* ================= BARRA DE NAVEGACIÓN ================= */ 
        .navbar { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 1.2rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            background-color: rgba(7, 11, 20, 0.88); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
        } 
        .logo {  
            font-size: 1.5rem;  
            font-weight: 800;  
            background: linear-gradient(to right, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 0.5px;  
        } 
        .nav-links { display: flex; gap: 2rem; } 
        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1.05rem; 
            position: relative; 
            padding-bottom: 5px; 
            transition: color 0.3s; 
            cursor: pointer; 
        } 
        .nav-links a:hover, .nav-links a.active-link { color: white; } 
         
        .nav-links a::after { 
            content: ''; 
            position: absolute; 
            width: 0; 
            height: 2px; 
            bottom: 0; 
            left: 50%; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            transition: all 0.3s ease; 
            transform: translateX(-50%); 
        } 
        .nav-links a:hover::after, .nav-links a.active-link::after { width: 100%; } 

        /* ================= SISTEMA DE PÁGINAS (VISTAS) ================= */ 
        .page-view { 
            display: none;  
            opacity: 0; 
            padding-top: 120px;  
            min-height: 100vh; 
            animation: fadeView 0.5s forwards ease-out; 
        } 
        .page-view.active-view { 
            display: block; 
        } 
        #inicio.active-view { 
            display: flex; 
        } 

        @keyframes fadeView { 
            0% { opacity: 0; transform: translateY(20px) scale(0.98); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        } 

        /* ================= HERO SECTION ================= */ 
        .hero { 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 0 1.5rem; 
            background: radial-gradient(circle at center, rgba(58, 123, 213, 0.15) 0%, transparent 65%); 
        } 
         
        .hero-icon { 
            font-size: 5rem; 
            margin-bottom: 1.5rem; 
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); 
            animation: floatIcon 3s ease-in-out infinite; 
        } 

        @keyframes floatIcon { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        } 

        #inicio.active-view .institution-tag { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: var(--primary); 
            margin-bottom: 1rem; 
            font-weight: 700; 
        } 

        #inicio.active-view h1 { 
            font-size: 3.5rem; 
            max-width: 1000px; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0px 0px 25px var(--accent-glow); 
            line-height: 1.2; 
        } 
        #inicio.active-view p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            max-width: 800px; 
            margin-bottom: 2.5rem; 
            line-height: 1.7; 
        } 
        #inicio.active-view .btn-main { 
            display: inline-block; 
            padding: 1rem 2.5rem; 
            background: linear-gradient(45deg, var(--secondary), var(--primary)); 
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2); 
        } 
         
        .btn-main:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); 
        } 

        /* ================= SECCIONES Y CONTENEDORES ================= */ 
        section { padding: 4rem 2rem 6rem; } 
        .section-title { 
            text-align: center; 
            font-size: 2.5rem; 
            margin-bottom: 3.5rem; 
            color: white; 
            position: relative; 
            display: inline-block; 
            left: 50%; 
            transform: translateX(-50%); 
        } 
        .section-title::after { 
            content: ''; 
            position: absolute; 
            bottom: -10px; 
            left: 25%; 
            width: 50%; 
            height: 3px; 
            background: linear-gradient(90deg, transparent, var(--primary), transparent); 
        } 
        .container { max-width: 1200px; margin: 0 auto; } 

        /* ================= TARJETAS GLASSMORPHISM ================= */ 
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; } 
         
        .card-glass { 
            background-color: var(--dark-card); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
            overflow: hidden; 
            padding: 2.5rem; 
        } 
        .card-glass:hover { 
            transform: translateY(-8px); 
            border-color: rgba(0, 210, 255, 0.5); 
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.15); 
        } 

        /* ================= COMPETENCIA GENERAL Y PERFIL ================= */ 
        .competencia-box { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9)); 
            border-left: 5px solid var(--primary); 
            padding: 3rem; 
            border-radius: 16px; 
            margin-bottom: 3rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            position: relative; 
        } 
        .competencia-box::before { 
            content: '🎯'; 
            position: absolute; 
            top: 2rem; 
            right: 2rem; 
            font-size: 3rem; 
            opacity: 0.2; 
        } 
        .competencia-box h3 { 
            font-size: 1.8rem; 
            color: white; 
            margin-bottom: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        } 
        .competencia-box p { 
            font-size: 1.15rem; 
            color: var(--text-muted); 
            line-height: 1.8; 
        } 

        .skill-list { list-style: none; margin-top: 1.5rem; } 
        .skill-list li { margin-bottom: 1rem; display: flex; align-items: flex-start; font-size: 1rem; color: var(--text-muted); } 
        .skill-list li span.icon-bullet { margin-right: 12px; font-size: 1.2rem; line-height: 1; } 

        /* ================= MALLA CURRICULAR (NIVELES) ================= */ 
        .nivel-card h3 { 
            font-size: 1.8rem; 
            color: var(--primary); 
            margin-bottom: 1.5rem; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 0.8rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        } 
        .subarea-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 1rem 1.2rem; 
            border-radius: 10px; 
            margin-bottom: 0.8rem; 
            border: 1px solid rgba(255,255,255,0.03); 
            transition: background 0.3s; 
        } 
        .subarea-item:hover { 
            background: rgba(0, 210, 255, 0.08); 
        } 
        .subarea-nombre { 
            font-weight: 600; 
            color: white; 
            font-size: 0.95rem; 
            padding-right: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        } 
        .subarea-horas { 
            background: rgba(0, 210, 255, 0.15); 
            color: var(--primary); 
            padding: 0.3rem 0.8rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            white-space: nowrap; 
        } 

        /* ================= SUPERHÉROE VIAJERO Y CAMINANTE ================= */ 
        #traveling-superhero {
            position: absolute;
            top: 150px;
            left: 50px;
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); /* Movimiento suave por la página */
            pointer-events: none;
        }
        #traveling-superhero > * {
            pointer-events: auto;
        }

        /* Bocadillo de diálogo del viajero */
        .travel-bubble {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.6);
            color: white;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 260px;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .travel-bubble::after {
            content: '';
            position: absolute;
            left: -8px;
            bottom: 20px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 8px solid rgba(15, 23, 42, 0.95);
        }

        /* Cuerpo del Superhéroe */
        .hero-puppet-body {
            position: relative;
            width: 90px;
            height: 110px;
            cursor: pointer;
            filter: drop-shadow(0 5px 20px rgba(0, 210, 255, 0.5));
        }

        .hero-torso-box {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 60px;
            height: 55px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid var(--primary);
            border-radius: 25px 25px 12px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-emblem-icon { font-size: 1.3rem; }

        .hero-cape-fly {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 70px;
            height: 45px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-radius: 15px;
            z-index: -1;
            transform: rotate(10deg);
            animation: capeMotion 1.5s ease-in-out infinite alternate;
        }
        @keyframes capeMotion {
            0% { transform: rotate(10deg) scaleX(1); }
            100% { transform: rotate(15deg) scaleX(1.1); }
        }

        .hero-head-box {
            position: absolute;
            top: 0;
            left: 8px;
            width: 74px;
            height: 58px;
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            border-radius: 30px 30px 22px 22px;
            border: 3px solid #ffffff;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }

        /* Ojos parpadeantes */
        .hero-eyes-row {
            position: absolute;
            top: 18px;
            left: 14px;
            display: flex;
            gap: 14px;
        }
        .hero-eye-dot {
            width: 11px;
            height: 13px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            animation: blinkTraveler 4s infinite;
        }
        .hero-pupil-dot {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background: #070b14;
            border-radius: 50%;
        }
        @keyframes blinkTraveler {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Boca que se mueve al hablar */
        .hero-mouth-line {
            position: absolute;
            bottom: 10px;
            left: 29px;
            width: 14px;
            height: 5px;
            background: #070b14;
            border-radius: 0 0 8px 8px;
        }
        .hero-puppet-body.speaking .hero-mouth-line {
            animation: speakMouthTravel 0.2s infinite alternate;
        }
        @keyframes speakMouthTravel {
            0% { height: 3px; width: 10px; }
            100% { height: 10px; width: 14px; background: #ff3366; border-radius: 50%; }
        }

        /* Mano señaladora activa */
        .hero-pointing-hand {
            position: absolute;
            top: 45px;
            right: -16px;
            font-size: 1.6rem;
            display: none;
        }
        .hero-puppet-body.pointing .hero-pointing-hand {
            display: block;
            animation: pointMotion 0.4s infinite alternate ease-in-out;
        }
        @keyframes pointMotion {
            0% { transform: translateX(0) rotate(-25deg); }
            100% { transform: translateX(8px) rotate(-5deg); }
        }

        /* Botón de tour guiado o explicación */
        .btn-tour {
            background: rgba(0, 210, 255, 0.15);
            color: var(--primary);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-tour:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 210, 255, 0.4);
        }

        /* ================= RESPONSIVO ================= */ 
        @media (max-width: 768px) { 
            .navbar { flex-direction: column; gap: 1rem; padding: 1rem; } 
            #inicio.active-view h1 { font-size: 2.3rem; } 
            .nav-links { gap: 1rem; } 
            .page-view { padding-top: 130px; } 
            .competencia-box { padding: 1.5rem; } 
        } 
    </style> 
</head> 
<body> 

    <!-- Fondo de partículas --> 
    <canvas id="canvas-bg"></canvas> 

    <!-- Barra de Navegación --> 
    <nav class="navbar" id="navbar"> 
        <div class="logo">☁️ CTP La Suiza - Cloud</div> 
        <div class="nav-links"> 
            <a data-target="inicio" class="nav-btn active-link">Inicio</a> 
            <a data-target="malla" class="nav-btn">Malla Curricular</a>
