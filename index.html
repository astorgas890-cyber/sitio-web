<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Servicios en la Nube - CTP La Suiza</title> 
    <style> 
        /* ================= VARIABLES Y RESET ================= */ 
        :root { 
            --primary: #00d2ff; 
            --secondary: #3a7bd5; 
            --dark: #070b14; 
            --dark-card: rgba(30, 41, 59, 0.65); 
            --text-light: #f8fafc; 
            --text-muted: #cbd5e1; 
            --accent-glow: rgba(0, 210, 255, 0.25); 
        } 

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; } 
         
        body {  
            background-color: var(--dark);  
            color: var(--text-light);  
            line-height: 1.6;  
            overflow-x: hidden;  
            min-height: 100vh; 
        } 

        /* ================= FONDO ANIMADO ================= */ 
        #canvas-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            opacity: 0.25; 
        } 

        /* ================= BARRA DE NAVEGACIÓN ================= */ 
        .navbar { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 1.2rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            background-color: rgba(7, 11, 20, 0.88); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
        } 
        .logo {  
            font-size: 1.5rem;  
            font-weight: 800;  
            background: linear-gradient(to right, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 0.5px;  
        } 
        .nav-links { display: flex; gap: 2rem; } 
        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1.05rem; 
            position: relative; 
            padding-bottom: 5px; 
            transition: color 0.3s; 
            cursor: pointer; 
        } 
        .nav-links a:hover, .nav-links a.active-link { color: white; } 
         
        .nav-links a::after { 
            content: ''; 
            position: absolute; 
            width: 0; 
            height: 2px; 
            bottom: 0; 
            left: 50%; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            transition: all 0.3s ease; 
            transform: translateX(-50%); 
        } 
        .nav-links a:hover::after, .nav-links a.active-link::after { width: 100%; } 

        /* ================= SISTEMA DE PÁGINAS (VISTAS) ================= */ 
        .page-view { 
            display: none;  
            opacity: 0; 
            padding-top: 100px;  
            min-height: 100vh; 
            animation: fadeView 0.5s forwards ease-out; 
        } 
        .page-view.active-view { 
            display: block; 
        } 
        #inicio.active-view { 
            display: flex; 
        } 

        @keyframes fadeView { 
            0% { opacity: 0; transform: translateY(20px) scale(0.98); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        } 

        /* ================= HERO SECTION ================= */ 
        .hero { 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 0 1.5rem; 
            background: radial-gradient(circle at center, rgba(58, 123, 213, 0.15) 0%, transparent 65%); 
        } 
         
        .hero-icon { 
            font-size: 5rem; 
            margin-bottom: 1.5rem; 
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); 
            animation: floatIcon 3s ease-in-out infinite; 
        } 

        @keyframes floatIcon { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        } 

        #inicio.active-view .institution-tag { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: var(--primary); 
            margin-bottom: 1rem; 
            font-weight: 700; 
        } 

        #inicio.active-view h1 { 
            font-size: 3.5rem; 
            max-width: 1000px; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0px 0px 25px var(--accent-glow); 
            line-height: 1.2; 
        } 
        #inicio.active-view p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            max-width: 800px; 
            margin-bottom: 2.5rem; 
            line-height: 1.7; 
        } 
        #inicio.active-view .btn-main { 
            display: inline-block; 
            padding: 1rem 2.5rem; 
            background: linear-gradient(45deg, var(--secondary), var(--primary)); 
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2); 
        } 
         
        .btn-main:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); 
        } 

        /* ================= SECCIONES Y CONTENEDORES ================= */ 
        section { padding: 4rem 2rem 6rem; } 
        .section-title { 
            text-align: center; 
            font-size: 2.5rem; 
            margin-bottom: 3.5rem; 
            color: white; 
            position: relative; 
            display: inline-block; 
            left: 50%; 
            transform: translateX(-50%); 
        } 
        .section-title::after { 
            content: ''; 
            position: absolute; 
            bottom: -10px; 
            left: 25%; 
            width: 50%; 
            height: 3px; 
            background: linear-gradient(90deg, transparent, var(--primary), transparent); 
        } 
        .container { max-width: 1200px; margin: 0 auto; } 

        /* ================= TARJETAS GLASSMORPHISM ================= */ 
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; } 
         
        .card-glass { 
            background-color: var(--dark-card); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
            overflow: hidden; 
            padding: 2.5rem; 
        } 
        .card-glass:hover { 
            transform: translateY(-8px); 
            border-color: rgba(0, 210, 255, 0.5); 
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.15); 
        } 

        /* ================= COMPETENCIA GENERAL Y PERFIL ================= */ 
        .competencia-box { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9)); 
            border-left: 5px solid var(--primary); 
            padding: 3rem; 
            border-radius: 16px; 
            margin-bottom: 3rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            position: relative; 
        } 
        .competencia-box::before { 
            content: '🎯'; 
            position: absolute; 
            top: 2rem; 
            right: 2rem; 
            font-size: 3rem; 
            opacity: 0.2; 
        } 
        .competencia-box h3 { 
            font-size: 1.8rem; 
            color: white; 
            margin-bottom: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        } 
        .competencia-box p { 
            font-size: 1.15rem; 
            color: var(--text-muted); 
            line-height: 1.8; 
        } 

        .skill-list { list-style: none; margin-top: 1.5rem; } 
        .skill-list li { margin-bottom: 1rem; display: flex; align-items: flex-start; font-size: 1rem; color: var(--text-muted); } 
        .skill-list li span.icon-bullet { margin-right: 12px; font-size: 1.2rem; line-height: 1; } 

        /* ================= MALLA CURRICULAR (NIVELES) ================= */ 
        .nivel-card h3 { 
            font-size: 1.8rem; 
            color: var(--primary); 
            margin-bottom: 1.5rem; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 0.8rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        } 
        .subarea-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 1rem 1.2rem; 
            border-radius: 10px; 
            margin-bottom: 0.8rem; 
            border: 1px solid rgba(255,255,255,0.03); 
            transition: background 0.3s; 
        } 
        .subarea-item:hover { 
            background: rgba(0, 210, 255, 0.08); 
        } 
        .subarea-nombre { 
            font-weight: 600; 
            color: white; 
            font-size: 0.95rem; 
            padding-right: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        } 
        .subarea-horas { 
            background: rgba(0, 210, 255, 0.15); 
            color: var(--primary); 
            padding: 0.3rem 0.8rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            white-space: nowrap; 
        } 

        /* ================= MUÑECO ASISTENTE ANIMADO (AVATAR VIVO) ================= */ 
        #assistant-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #assistant-container > * {
            pointer-events: auto;
        }

        /* Burbuja de diálogo */
        .speech-bubble {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.5);
            color: white;
            padding: 15px 20px;
            border-radius: 18px;
            max-width: 280px;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            display: none;
            animation: fadeInBubble 0.3s ease-out forwards;
        }
        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            right: -8px;
            bottom: 25px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 8px solid rgba(15, 23, 42, 0.95);
        }

        /* Estructura del Muñeco (Avatar SVG/HTML) */
        .puppet-wrapper {
            position: relative;
            width: 110px;
            height: 130px;
            cursor: pointer;
            filter: drop-shadow(0 5px 20px rgba(0, 210, 255, 0.4));
            transition: transform 0.3s;
        }
        .puppet-wrapper:hover {
            transform: scale(1.08);
        }

        /* Cuerpo del robot/personaje */
        .puppet-body {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid var(--primary);
            border-radius: 40px 40px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.3);
        }
        .puppet-core {
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: corePulse 2s infinite alternate;
        }
        @keyframes corePulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Cabeza */
        .puppet-head {
            position: absolute;
            top: 0;
            left: 10px;
            width: 90px;
            height: 70px;
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            border-radius: 35px 35px 25px 25px;
            border: 3px solid #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: headFloat 3s ease-in-out infinite;
        }
        @keyframes headFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Ojos */
        .puppet-eyes {
            position: absolute;
            top: 22px;
            left: 18px;
            display: flex;
            gap: 18px;
        }
        .eye {
            width: 14px;
            height: 16px;
            background: #070b14;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            animation: blinkEye 4s infinite;
        }
        .pupil {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
        }
        @keyframes blinkEye {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Boca animada al hablar */
        .puppet-mouth {
            position: absolute;
            bottom: 12px;
            left: 35px;
            width: 16px;
            height: 8px;
            background: #070b14;
            border-radius: 0 0 10px 10px;
            transition: all 0.1s ease;
        }
        .puppet-head.speaking .puppet-mouth {
            animation: speakMouth 0.25s infinite alternate;
        }
        @keyframes speakMouth {
            0% { height: 4px; width: 14px; border-radius: 5px; }
            100% { height: 14px; width: 16px; border-radius: 50%; background: #ff3366; }
        }

        /* Antena con luz */
        .puppet-antenna {
            position: absolute;
            top: -16px;
            left: 42px;
            width: 4px;
            height: 18px;
            background: white;
        }
        .puppet-antenna-ball {
            position: absolute;
            top: -24px;
            left: 36px;
            width: 16px;
            height: 16px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffcc00;
            animation: antennaGlow 1s infinite alternate;
        }
        @keyframes antennaGlow
