<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Servicios en la Nube - CTP La Suiza</title> 
    <style> 
        /* ================= VARIABLES Y RESET ================= */ 
        :root { 
            --primary: #00d2ff; 
            --secondary: #3a7bd5; 
            --dark: #070b14; 
            --dark-card: rgba(30, 41, 59, 0.65); 
            --text-light: #f8fafc; 
            --text-muted: #cbd5e1; 
            --accent-glow: rgba(0, 210, 255, 0.25); 
        } 
 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; } 
         
        body {  
            background-color: var(--dark);  
            color: var(--text-light);  
            line-height: 1.6;  
            overflow-x: hidden;  
            min-height: 100vh; 
        } 
 
        /* ================= FONDO ANIMADO ================= */ 
        #canvas-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            opacity: 0.25; 
        } 
 
        /* ================= BARRA DE NAVEGACIÓN ================= */ 
        .navbar { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 1.2rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            background-color: rgba(7, 11, 20, 0.88); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
        } 
        .logo {  
            font-size: 1.5rem;  
            font-weight: 800;  
            background: linear-gradient(to right, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 0.5px;  
        } 
        .nav-links { display: flex; gap: 2rem; } 
        .nav-links a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 1.05rem; 
            position: relative; 
            padding-bottom: 5px; 
            transition: color 0.3s; 
            cursor: pointer; 
        } 
        .nav-links a:hover, .nav-links a.active-link { color: white; } 
         
        .nav-links a::after { 
            content: ''; 
            position: absolute; 
            width: 0; 
            height: 2px; 
            bottom: 0; 
            left: 50%; 
            background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            transition: all 0.3s ease; 
            transform: translateX(-50%); 
        } 
        .nav-links a:hover::after, .nav-links a.active-link::after { width: 100%; } 
 
        /* ================= SISTEMA DE PÁGINAS (VISTAS) ================= */ 
        .page-view { 
            display: none;  
            opacity: 0; 
            padding-top: 100px;  
            min-height: 100vh; 
            animation: fadeView 0.5s forwards ease-out; 
        } 
        .page-view.active-view { 
            display: block; 
        } 
        #inicio.active-view { 
            display: flex; 
        } 
 
        @keyframes fadeView { 
            0% { opacity: 0; transform: translateY(20px) scale(0.98); } 
            100% { opacity: 1; transform: translateY(0) scale(1); } 
        } 
 
        /* ================= HERO SECTION ================= */ 
        .hero { 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 0 1.5rem; 
            background: radial-gradient(circle at center, rgba(58, 123, 213, 0.15) 0%, transparent 65%); 
        } 
         
        .hero-icon { 
            font-size: 5rem; 
            margin-bottom: 1.5rem; 
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); 
            animation: floatIcon 3s ease-in-out infinite; 
        } 
 
        @keyframes floatIcon { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        } 
 
        #inicio.active-view .institution-tag { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: var(--primary); 
            margin-bottom: 1rem; 
            font-weight: 700; 
        } 
 
        #inicio.active-view h1 { 
            font-size: 3.5rem; 
            max-width: 1000px; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0px 0px 25px var(--accent-glow); 
            line-height: 1.2; 
        } 
        #inicio.active-view p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            max-width: 800px; 
            margin-bottom: 2.5rem; 
            line-height: 1.7; 
        } 
        #inicio.active-view .btn-main { 
            display: inline-block; 
            padding: 1rem 2.5rem; 
            background: linear-gradient(45deg, var(--secondary), var(--primary)); 
            color: white; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            cursor: pointer; 
            border: none; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2); 
        } 
         
        .btn-main:hover { 
            transform: translateY(-3px) scale(1.05); 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); 
        } 
 
        /* ================= SECCIONES Y CONTENEDORES ================= */ 
        section { padding: 4rem 2rem 6rem; } 
        .section-title { 
            text-align: center; 
            font-size: 2.5rem; 
            margin-bottom: 3.5rem; 
            color: white; 
            position: relative; 
            display: inline-block; 
            left: 50%; 
            transform: translateX(-50%); 
        } 
        .section-title::after { 
            content: ''; 
            position: absolute; 
            bottom: -10px; 
            left: 25%; 
            width: 50%; 
            height: 3px; 
            background: linear-gradient(90deg, transparent, var(--primary), transparent); 
        } 
        .container { max-width: 1200px; margin: 0 auto; } 
 
        /* ================= TARJETAS GLASSMORPHISM ================= */ 
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; }
